name: Deploy staging

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: deploy-landing-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy tested commit to Cloudflare preview
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
      PUBLIC_RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Check out tested commit
        uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build landing site
        run: pnpm run build

      - name: Verify built release identity
        run: |
          body="$(cat dist/api/release)"
          jq -e --arg sha "$DEPLOY_SHA" \
            '.status == "ok" and .release == $sha' \
            <<<"$body" >/dev/null

      - name: Deploy stable staging preview
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy dist
            --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }}
            --branch=staging
            --commit-hash=${{ env.DEPLOY_SHA }}
