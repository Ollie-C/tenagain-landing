name: Release production

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full 40-character commit SHA already verified in staging
        required: true
        type: string
      confirmation:
        description: Type DEPLOY to confirm the production release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-landing-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy exact commit to Cloudflare production
    if: ${{ inputs.confirmation == 'DEPLOY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      DEPLOY_SHA: ${{ inputs.commit_sha }}
      PUBLIC_RELEASE_SHA: ${{ inputs.commit_sha }}

    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require a commit contained in main
        run: |
          if [[ ! "$DEPLOY_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "commit_sha must be a full 40-character SHA" >&2
            exit 1
          fi
          git cat-file -e "${DEPLOY_SHA}^{commit}"
          git merge-base --is-ancestor "$DEPLOY_SHA" origin/main
          git checkout --detach "$DEPLOY_SHA"

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build landing site
        run: pnpm run build

      - name: Verify built release identity
        run: |
          body="$(cat dist/api/release)"
          jq -e --arg sha "${DEPLOY_SHA,,}" \
            '.status == "ok" and (.release | ascii_downcase) == $sha' \
            <<<"$body" >/dev/null

      - name: Deploy approved production release
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy dist
            --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }}
            --branch=main
            --commit-hash=${{ env.DEPLOY_SHA }}
